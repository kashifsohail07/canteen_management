<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a56db">
    <title>Offline – Canteen Ledger</title>
    <style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;color:#fff;background:linear-gradient(160deg,#1e429f,#1a56db 60%,#0b6b50);letter-spacing:-0.01em}
        .card{max-width:340px}
        .icon{width:84px;height:84px;margin:0 auto 18px;display:grid;place-items:center;font-size:42px;background:rgba(255,255,255,.16);border-radius:26px}
        h1{margin:0 0 8px;font-size:1.5rem}
        p{margin:0 0 22px;opacity:.9;line-height:1.5}
        button{min-height:52px;padding:0 28px;font-size:1rem;font-weight:800;color:#057a55;background:#fff;border:0;border-radius:16px}
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>No internet</h1>
        <p>An internet connection is required to save canteen entries. Please try again when you are back online.</p>
        <button onclick="location.reload()">Try Again</button>
    </div>
</body>
</html>
